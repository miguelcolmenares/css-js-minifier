name: 🐛 Bug report
description: Something does not work, or works differently than you expected
title: "[Bug]: "
labels: ["bug"]
assignees:
  - miguelcolmenares
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. It only takes a minute.

        Before you start, the [troubleshooting page](https://miguelcolmenares.com/css-js-minifier/docs/troubleshooting/) lists quick fixes and the [FAQ](https://miguelcolmenares.com/css-js-minifier/docs/faq/) answers common questions. Please also search the [existing issues](https://github.com/miguelcolmenares/css-js-minifier/issues?q=is%3Aissue), in case it is already reported.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you expected and what you got instead. If there was an error message, paste its exact text.
      placeholder: "I expected the file to be minified, but I got the message 'CSS minification error: ...'"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you clicked or pressed, in order, starting from opening the file. Say whether it is a CSS or a JavaScript file.
      placeholder: |
        1. Open a CSS file
        2. Right-click and choose "Minify this File"
        3. See the error
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Extension and VS Code version
      description: "Extension: click it in the Extensions view, the version is next to its name. VS Code: Help > About (Code > About Visual Studio Code on macOS)."
      placeholder: "Extension 1.3.4, VS Code 1.144.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the architecture, for example x64 or ARM. The OS line in the VS Code About dialog shows it.
      placeholder: "Windows 11 x64, macOS 15 on Apple silicon, Ubuntu 24.04 ARM"
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Sample file (optional)
      description: The smallest CSS or JavaScript that shows the problem. Remove anything private first.
      render: text

  - type: textarea
    id: settings
    attributes:
      label: Settings (optional)
      description: The `css-js-minifier.*` lines from your `settings.json`, or say that you use the defaults.
      render: json

  - type: textarea
    id: log
    attributes:
      label: Extension log (optional)
      description: 'Open View > Output and choose "CSS & JS Minifier" in the drop-down. Paste what it shows.'
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Screenshots, other extensions you use, or anything else that might help.
