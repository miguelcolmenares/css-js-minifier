name: ✨ Feature request
description: Suggest an idea or a missing feature
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - miguelcolmenares
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check the [existing issues](https://github.com/miguelcolmenares/css-js-minifier/issues?q=is%3Aissue) first, it may already be there.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the situation you run into. Start from what you need, not from the solution.
      placeholder: "When I minify a file, I want to ... but today I have to ..."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe how you imagine it working.
      placeholder: "A setting that ... / A command that ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you thought of (optional)
      description: Workarounds you use today, or other tools that do it.
