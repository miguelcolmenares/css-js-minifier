name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.vscodeignore'
      - 'src/**'
      - 'scripts/verify-vsix-activation.mjs'
      - '.github/workflows/release.yml'
      - 'webpack.config.cjs'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-x64,   os: macos-15-intel }
          - { target: darwin-arm64, os: macos-latest }
          - { target: linux-x64,    os: ubuntu-latest }
          - { target: linux-arm64,  os: ubuntu-24.04-arm }
          - { target: win32-x64,    os: windows-latest }
          - { target: win32-arm64,  os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension bundle (webpack production)
        run: npm run package

      - name: Read extension version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package .vsix for ${{ matrix.target }}
        shell: bash
        run: |
          npx vsce package \
            --target ${{ matrix.target }} \
            --out css-js-minifier-${{ steps.version.outputs.value }}-${{ matrix.target }}.vsix

      - name: Verify native bindings can activate on ${{ matrix.target }}
        shell: bash
        run: |
          node scripts/verify-vsix-activation.mjs \
            css-js-minifier-${{ steps.version.outputs.value }}-${{ matrix.target }}.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: css-js-minifier-${{ steps.version.outputs.value }}-${{ matrix.target }}.vsix
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach .vsix files to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all .vsix artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: vsix-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh dist/

      - name: Upload .vsix files to release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" dist/*.vsix --clobber
