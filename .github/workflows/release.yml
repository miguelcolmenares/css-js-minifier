name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.vscodeignore'
      - 'src/**'
      - 'scripts/verify-vsix-activation.mjs'
      - '.github/workflows/release.yml'
      - 'webpack.config.cjs'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-x64,   os: macos-15-intel }
          - { target: darwin-arm64, os: macos-latest }
          - { target: linux-x64,    os: ubuntu-latest }
          - { target: linux-arm64,  os: ubuntu-24.04-arm }
          - { target: win32-x64,    os: windows-latest }
          - { target: win32-arm64,  os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension bundle (webpack production)
        run: npm run package

      - name: Read extension version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package .vsix for ${{ matrix.target }}
        shell: bash
        run: |
          npx vsce package \
            --target ${{ matrix.target }} \
            --out css-js-minifier-${{ steps.version.outputs.value }}-${{ matrix.target }}.vsix

      - name: Verify native bindings can activate on ${{ matrix.target }}
        shell: bash
        run: |
          node scripts/verify-vsix-activation.mjs \
            css-js-minifier-${{ steps.version.outputs.value }}-${{ matrix.target }}.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: css-js-minifier-${{ steps.version.outputs.value }}-${{ matrix.target }}.vsix
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach .vsix files to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all .vsix artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: vsix-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh dist/

      - name: Publish .vsix files to release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Release/asset immutability policy: this step does NOT use --clobber.
        # If the release already exists we only upload assets that are not
        # already present — any attempt to overwrite an existing asset will
        # fail loudly, which is the intended behaviour. To re-publish a tag
        # after the fact you must first delete the affected release assets
        # (or the entire release) by hand. Combined with the tag-protection
        # ruleset on refs/tags/v* this guarantees that a given tag → release
        # → .vsix mapping is stable forever.
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — uploading .vsix assets"
            gh release upload "${{ github.ref_name }}" dist/*.vsix
          else
            echo "Creating release ${{ github.ref_name }} with generated notes + all .vsix"
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              dist/*.vsix
          fi

  publish:
    name: Publish .vsix files to VS Code Marketplace
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (for vsce)
        run: npm ci

      - name: Download all .vsix artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: vsix-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh dist/

      - name: Verify VSCE_PAT secret is configured
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not configured on this repository."
            echo "::error::Add it under Settings → Secrets and variables → Actions →"
            echo "::error::New repository secret, using a Personal Access Token from"
            echo "::error::https://dev.azure.com with 'Marketplace (Manage)' scope."
            exit 1
          fi
          echo "VSCE_PAT is present (length: ${#VSCE_PAT})."

      - name: Publish all .vsix files to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # `vsce publish --packagePath` accepts any number of pre-built .vsix
        # files and uploads each one. The Marketplace uses the `--target`
        # baked into each .vsix by the packaging step (see the `build` job)
        # to serve the right binary per platform. Fails fast on the first
        # rejected upload (e.g. duplicate version), which is desirable given
        # our immutability policy — a failed publish here means the tag
        # needs a fresh version, not a retry with the same one.
        run: |
          set -euo pipefail
          count=$(find dist -maxdepth 1 -name '*.vsix' -type f | wc -l | tr -d ' ')
          echo "Publishing $count .vsix files to Marketplace..."
          npx vsce publish --packagePath dist/*.vsix
