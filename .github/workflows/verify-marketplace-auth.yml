name: Verify Marketplace Auth

# Manual smoke test for the Microsoft Entra identity and the Marketplace
# publisher role. Runs `vsce verify-pat --azure-credential`, which validates the
# identity against the Marketplace API WITHOUT publishing anything, so no
# version is burned. Use this before dispatching a real release to catch
# identity or role problems early (app registration removed, federated
# credential subject changed, identity no longer a member of the publisher).

on:
  workflow_dispatch:

permissions:
  contents: read
  # Lets azure/login exchange the run's OIDC token for an Entra access token.
  id-token: write

jobs:
  verify:
    name: Verify the Entra identity can publish for miguel-colmenares
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (for vsce)
        run: npm ci

      - name: Check the Entra identifiers are present
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured on this repository."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "AZURE_CLIENT_ID and AZURE_TENANT_ID are present."

      - name: Sign in to Azure with the run's OIDC token
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify the identity has publish rights for publisher 'miguel-colmenares'
        # `vsce verify-pat --azure-credential` is the supported smoke test for
        # an Entra identity: it authenticates against the Marketplace API and
        # checks the identity can publish for the given publisher, but it does
        # NOT upload anything. Nothing is billed, no version is burned, and no
        # Marketplace state changes. It exits non-zero, with a clear vsce error,
        # if the identity is not a member of the publisher.
        run: npx --package=@vscode/vsce -- vsce verify-pat --azure-credential miguel-colmenares

      - name: Show current Marketplace record for miguel-colmenares.css-js-minifier
        # Read-only Marketplace query. It confirms the extension is registered
        # under the expected publisher/id combination and prints the current
        # published version, install count, etc. It does not use the identity
        # (public API), so if this succeeds but the verification above fails,
        # the problem is the identity, not the extension.
        run: npx --package=@vscode/vsce -- vsce show miguel-colmenares.css-js-minifier

      - name: Summary
        run: |
          {
            echo "## Marketplace auth verification"
            echo ""
            echo "✅ The Entra identifiers are configured on this repository."
            echo "✅ The identity has publish rights for publisher \`miguel-colmenares\`."
            echo "✅ Extension \`miguel-colmenares.css-js-minifier\` is registered on Marketplace."
            echo ""
            echo "The identity is ready to be used by the \`publish\` job in \`release.yml\`."
            echo "Dispatch \`release.yml\` with the target version to cut a release."
          } >> "$GITHUB_STEP_SUMMARY"
