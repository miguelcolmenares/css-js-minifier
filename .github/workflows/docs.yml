name: Docs

on:
  push:
    branches: [master]
    paths:
      [
        "site/**",
        "docs/**",
        "examples/**",
        "README.md",
        "CHANGELOG.md",
        ".github/workflows/docs.yml",
      ]
  pull_request:
    paths:
      [
        "site/**",
        "docs/**",
        "examples/**",
        "README.md",
        "CHANGELOG.md",
        ".github/workflows/docs.yml",
      ]
  # A release rebuilds the site from release.yml. A release made with GITHUB_TOKEN starts no other workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-26.04
    # A new push to a PR cancels the superseded build. Builds on master and on dispatch are never
    # cancelled. Only pull requests share a group per ref. Every other run gets its own group, because
    # a group also replaces a queued run with a newer one even when cancel-in-progress is false. This
    # keeps builds out of the `pages` group below, so a deploy can no longer cancel a PR check.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The picture a shared link shows (site.image). It is drawn in the job, so no image is committed.
      - uses: miguelcolmenares/social-card-action@8927027164b0022e3ba12c0736ce575d547fe4ce # v0.1.0
        with:
          path: site/public/social.png
          name: "CSS & JS Minifier"
          description: "Minify CSS and JavaScript inside VS Code with one command. Install guide, quick start, shortcuts, settings and help. Runs locally and offline."
          host: "miguelcolmenares.com/css-js-minifier"
      # Installs the site, builds it, checks it, and uploads the Pages artifact.
      - uses: miguelcolmenares/docs-sitekit@v0.3.0
        with:
          version: 0.3.0

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    # Deployments are serialized and never cancelled mid-way, the setting GitHub recommends for Pages.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
