name: Test VS Code Stable

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-stable:
    name: Test on ${{ matrix.os }} with VS Code Stable
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache dependencies
        uses: actions/cache@v6
        id: cache-deps
        with:
          path: |
            ~/.npm
            node_modules
          key: deps-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-v2-${{ runner.os }}-
            deps-v2-
      - if: ${{ steps.cache-deps.outputs.cache-hit != 'true'}}
        name: List the state of node modules
        continue-on-error: true
        run: npm list
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests with VS Code Stable
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test
        env:
          VSCODE_VERSION: 'stable'
        timeout-minutes: 10

      # Coverage is reported from this one job (Ubuntu, VS Code Stable) so the 3 x 3 matrix does
      # not repeat it. It is informational: `continue-on-error` keeps a coverage problem from
      # turning the job red, and no threshold is enforced. It reruns the suite once more with the
      # bundle rebuilt for coverage (see `pretest:coverage`), then writes the table to the job summary.
      - name: Measure test coverage
        if: ${{ matrix.os == 'ubuntu-26.04' }}
        continue-on-error: true
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run test:coverage
        env:
          VSCODE_VERSION: 'stable'
        timeout-minutes: 10
      - name: Publish coverage summary
        if: ${{ matrix.os == 'ubuntu-26.04' }}
        continue-on-error: true
        shell: bash
        run: node scripts/coverage-report.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
