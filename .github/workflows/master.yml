name: Build - Master

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Formatting and Markdown, once. Both are OS-independent, so running them in
  # the 3-OS test matrix would just repeat the same answer three times.
  #
  # This job exists because neither check had anywhere to run: `npm test`
  # invokes ESLint through `pretest`, but `format:check` was never wired into
  # CI at all — which is how three Markdown files sat unformatted without
  # anyone finding out.
  quality:
    name: Format & Markdown
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint Markdown
        run: npm run lint:md

  # Primary test job - tests with minimum supported VS Code version
  test:
    name: Test on ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache dependencies
        uses: actions/cache@v6
        id: cache-deps
        with:
          path: |
            ~/.npm
            node_modules
          key: deps-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-v2-${{ runner.os }}-
            deps-v2-
      - if: ${{ steps.cache-deps.outputs.cache-hit != 'true'}}
        name: List the state of node modules
        continue-on-error: true
        run: npm list
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test
        env:
          VSCODE_VERSION: '1.136.0'
        timeout-minutes: 10