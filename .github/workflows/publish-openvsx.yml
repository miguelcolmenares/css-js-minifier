name: Publish to Open VSX

# Publishes the platform-specific .vsix files of an existing GitHub Release to
# the Open VSX registry (https://open-vsx.org), which VSCodium, Eclipse Theia,
# Gitpod and other VS Code forks use instead of the Microsoft Marketplace.
#
# Authentication is tokenless: `ovsx publish --trusted-publishing` exchanges the
# run's OIDC ID token for a publishing token that lives a few minutes and is
# scoped to this one extension. There is no OVSX_PAT. See "Trusted publishing"
# below for why this workflow is dispatched instead of being called.
#
# `workflow_dispatch` is the only entry point, used two ways:
#
# 1. `release.yml` starts it with `gh workflow run` after `tag-and-release`,
#    alongside the Marketplace `publish` job. The two registries are
#    independent: a failure on one never blocks the other.
#
# 2. The maintainer starts it by hand to backfill a version that already has a
#    GitHub Release, or to retry after a failure. Both paths run this same file
#    from `master`, so a retry cannot behave differently from a release.
#
# Trusted publishing
# ==================
# The trusted publisher registered at open-vsx.org names this file,
# `publish-openvsx.yml`. Open VSX matches the OIDC `workflow_ref` claim and
# records `job_workflow_ref` without matching it (see `matches()` in
# GitHubTrustedPublishingProviderSupport.java). With `workflow_call`,
# `workflow_ref` names the CALLING workflow, so a release would present
# `release.yml` and be refused. That is why `release.yml` dispatches this
# workflow instead of calling it, and why `workflow_call` is deliberately
# absent: adding it back would create a path that always fails to authenticate.
#
# The registration is not tied to a branch or tag, so any ref that runs this
# file is trusted. The `Protect master` ruleset is what guards the file itself.
#
# The .vsix files are always downloaded from the GitHub Release, never rebuilt,
# so Open VSX serves byte-for-byte the same artifacts as the Marketplace.
#
# Retries are safe: `--skip-duplicate` makes a target that is already on Open
# VSX a no-op, so a re-run only uploads what is missing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish to Open VSX (e.g. 1.3.4). The GitHub Release
          v<version> must already exist with its .vsix assets attached.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-openvsx-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish .vsix files to Open VSX
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Required for trusted publishing: it is what lets ovsx request an OIDC
      # ID token from GitHub to exchange for a short-lived publishing token.
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      OVSX_NAMESPACE: miguel-colmenares
      OVSX_EXTENSION: css-js-minifier
    steps:
      - name: Validate version input
        shell: bash
        # The value reaches shell commands and a release tag name, so accept
        # only a plain X.Y.Z before using it anywhere.
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected X.Y.Z, without the leading 'v'."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # ovsx 1.x requires Node >= 22 (the rest of the repo's workflows use 20).
          node-version: 24

      - name: Download .vsix files from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" --dir dist --pattern '*.vsix'
          ls -lh dist/

      - name: Publish every .vsix to Open VSX
        # One `ovsx publish` call for all targets, not one per file: the OIDC
        # token exchange, the registry version lookup and the namespace size
        # limit then happen once for the whole release instead of once per
        # target. ovsx uploads the files concurrently, reports every failure,
        # and exits 1 if any of them failed, so a partial failure is still
        # visible and the targets that worked stay published.
        #
        # No OVSX_PAT is set anywhere in this job on purpose: ovsx reads that
        # variable itself and a token always takes precedence over trusted
        # publishing, so leaving one in the environment would silently disable
        # OIDC.
        run: |
          set -euo pipefail
          # Releases before the Alpine targets have 6 .vsix files, later ones have 8, so
          # require a minimum instead of an exact number to keep backfills working.
          minimum=6
          count=$(find dist -maxdepth 1 -name '*.vsix' -type f | wc -l | tr -d ' ')
          if [ "$count" -lt "$minimum" ]; then
            echo "::error::Expected at least $minimum .vsix files in release v${VERSION}, found $count."
            exit 1
          fi
          echo "Publishing $count .vsix files from release v${VERSION} with trusted publishing."

          # Pinned: this step handles the publishing credential, so a new ovsx
          # release is adopted by a reviewed change, not silently.
          npx --yes ovsx@1.3.0 publish \
            --trusted-publishing \
            --skip-duplicate \
            --packagePath dist/*.vsix

      - name: Summary
        if: success()
        run: |
          {
            echo "## Open VSX"
            echo ""
            echo "Version \`${VERSION}\` is published for all targets: https://open-vsx.org/extension/${OVSX_NAMESPACE}/${OVSX_EXTENSION}"
            echo ""
            echo "Published with trusted publishing (OIDC), no stored token."
          } >> "$GITHUB_STEP_SUMMARY"
