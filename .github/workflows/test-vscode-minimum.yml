name: Test VS Code Minimum

on:
  push:
    branches: [ master ]
  # Only runs when a change can affect the test results. The `push` trigger
  # above is unfiltered, so `master` is always tested.
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.vscode-test.mjs'
      - 'webpack.config.cjs'
      - 'tsconfig.json'
      - 'tsdoc.json'
      - 'eslint.config.mjs'
      - 'l10n/**'
      - 'package.nls*.json'
      - 'scripts/**'
      - '.github/workflows/test-vscode-minimum.yml'
  # Started by auto-merge-dependabot.yml after it merges a Dependabot PR (a merge made with
  # GITHUB_TOKEN does not start the `push` trigger above). Can also be run by hand.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the superseded run. Runs on master are never cancelled.
concurrency:
  # Only pull requests share a group per ref. Every other run gets its own group, because a
  # group also replaces a queued run with a newer one even when cancel-in-progress is false.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-minimum:
    name: Test on ${{ matrix.os }} with VS Code 1.146.0
    timeout-minutes: 10
    strategy:
      matrix:
        # No macOS here: `master.yml` runs the same VS Code version on macOS
        # (`Test on macos-latest`, a required check), so this job would repeat it.
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
      # Caches the npm download cache only. node_modules is never cached: npm ci removes it
      # before installing, and the native bindings in it belong to one platform and Node build.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests with VS Code 1.146.0
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test
        env:
          VSCODE_VERSION: '1.146.0'
        timeout-minutes: 10