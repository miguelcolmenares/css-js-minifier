name: Test VS Code Minimum

on:
  push:
    branches: [ master ]
  # Only runs when a change can affect the test results. The `push` trigger
  # above is unfiltered, so `master` is always tested.
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.vscode-test.mjs'
      - 'webpack.config.cjs'
      - 'tsconfig.json'
      - 'tsdoc.json'
      - 'eslint.config.mjs'
      - 'l10n/**'
      - 'package.nls*.json'
      - 'scripts/**'
      - '.github/workflows/test-vscode-minimum.yml'

permissions:
  contents: read

# A new push to a PR cancels the superseded run. Runs on master are never cancelled.
concurrency:
  # Only pull requests share a group per ref. Every other run gets its own group, because a
  # group also replaces a queued run with a newer one even when cancel-in-progress is false.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-minimum:
    name: Test on ${{ matrix.os }} with VS Code 1.144.0
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache dependencies
        uses: actions/cache@v6
        id: cache-deps
        with:
          path: |
            ~/.npm
            node_modules
          key: deps-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-v2-${{ runner.os }}-
            deps-v2-
      - if: ${{ steps.cache-deps.outputs.cache-hit != 'true'}}
        name: List the state of node modules
        continue-on-error: true
        run: npm list
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests with VS Code 1.144.0
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test
        env:
          VSCODE_VERSION: '1.144.0'
        timeout-minutes: 10