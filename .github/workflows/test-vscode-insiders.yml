name: Test VS Code Insiders

on:
  push:
    branches: [ master ]
  # Only runs when a change can affect the test results. The `push` trigger
  # above is unfiltered, so `master` is always tested.
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.vscode-test.mjs'
      - 'webpack.config.cjs'
      - 'tsconfig.json'
      - 'tsdoc.json'
      - 'eslint.config.mjs'
      - 'l10n/**'
      - 'package.nls*.json'
      - 'scripts/**'
      - '.github/workflows/test-vscode-insiders.yml'
  # Insiders moves upstream, not with the PR, so it is checked daily on master
  # instead of on every change.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# A new push to a PR cancels the superseded run. Runs on master and on the
# schedule are never cancelled.
concurrency:
  # Only pull requests share a group per ref. Every other run gets its own group, because a
  # group also replaces a queued run with a newer one even when cancel-in-progress is false.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-insiders:
    name: Test on ${{ matrix.os }} with VS Code Insiders
    timeout-minutes: 10
    strategy:
      # Do not cancel the other OS jobs when one fails: the Insiders channel is
      # inherently unstable and a break on one platform is not evidence of a
      # regression on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
      # Caches the npm download cache only. node_modules is never cached: npm ci removes it
      # before installing, and the native bindings in it belong to one platform and Node build.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # xvfb gives the VS Code test host a display on Linux. It is preinstalled on GitHub's Ubuntu
      # images, so apt only runs if a future image drops it. macOS and Windows need no display.
      - name: Ensure xvfb is installed
        if: ${{ runner.os == 'Linux' }}
        run: command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - name: Run tests with VS Code Insiders
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a npm test' || 'npm test' }}
        env:
          VSCODE_VERSION: 'insiders'
        timeout-minutes: 10