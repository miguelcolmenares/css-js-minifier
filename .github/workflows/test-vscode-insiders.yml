name: Test VS Code Insiders

on:
  push:
    branches: [ master ]
  # Only runs when a change can affect the test results. The `push` trigger
  # above is unfiltered, so `master` is always tested.
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.vscode-test.mjs'
      - 'webpack.config.cjs'
      - 'tsconfig.json'
      - 'tsdoc.json'
      - 'eslint.config.mjs'
      - 'l10n/**'
      - 'package.nls*.json'
      - 'scripts/**'
      - '.github/workflows/test-vscode-insiders.yml'
  # Insiders moves upstream, not with the PR, so it is checked daily on master
  # instead of on every change.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# A new push to a PR cancels the superseded run. Runs on master and on the
# schedule are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-insiders:
    name: Test on ${{ matrix.os }} with VS Code Insiders
    timeout-minutes: 10
    strategy:
      # Do not cancel the other OS jobs when one fails: the Insiders channel is
      # inherently unstable and a break on one platform is not evidence of a
      # regression on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache dependencies
        uses: actions/cache@v6
        id: cache-deps
        with:
          path: |
            ~/.npm
            node_modules
          key: deps-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            deps-v2-${{ runner.os }}-
            deps-v2-
      - if: ${{ steps.cache-deps.outputs.cache-hit != 'true'}}
        name: List the state of node modules
        continue-on-error: true
        run: npm list
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests with VS Code Insiders
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test
        env:
          VSCODE_VERSION: 'insiders'
        timeout-minutes: 10